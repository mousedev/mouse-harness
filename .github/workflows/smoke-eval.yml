# Nightly one-task smoke evaluation: run terminal-bench/regex-log through the
# Harbor adapter with Kimi K3 via OpenRouter and assert that the harness trace
# ends with a well-formed `mouse.done` record. It proves the bundle, the Harbor
# adapter, and the completion loop still fit together; it does not score the
# harness (see full-eval.yml). Skips itself when OPENROUTER_API_KEY is not set,
# so forks without the secret stay green.
name: smoke-eval

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.9
  HARBOR_VERSION: 0.22.0

jobs:
  # Secrets cannot be read in a job-level `if`, so a step exports whether the
  # key is present and the eval job gates on that output.
  gate:
    name: check secret
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not set; skipping the smoke eval" >> "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    name: regex-log via harbor
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install harbor ${{ env.HARBOR_VERSION }}
        run: |
          uv tool install "harbor==${HARBOR_VERSION}"
          harbor --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm bundle
      - name: Download terminal-bench/regex-log
        run: harbor tasks download terminal-bench/regex-log -o evals/tasks
      - name: Run the task
        timeout-minutes: 15
        run: |
          PYTHONPATH=. harbor run -p evals/tasks/regex-log \
            --agent evals.harbor.mouse_agent:MouseAgent \
            --model openrouter/moonshotai/kimi-k3 \
            --jobs-dir evals/jobs -y
      - name: Trace ends with mouse.done
        run: |
          trace="$(find evals/jobs -name mouse-harness.jsonl | head -n1)"
          if [ -z "$trace" ]; then
            echo "no mouse-harness.jsonl under evals/jobs" >&2
            find evals/jobs -maxdepth 4 -print >&2
            exit 1
          fi
          echo "trace: $trace"
          tail -n1 "$trace" | jq .
          tail -n1 "$trace" | jq -e '
            .type == "mouse.done"
            and (.outcome | IN("satisfied", "stalled", "wall_clock", "step_budget", "blocked"))
          ' > /dev/null
          echo "outcome: $(tail -n1 "$trace" | jq -r .outcome)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-eval-jobs-${{ github.run_id }}
          path: evals/jobs
          if-no-files-found: warn
          retention-days: 14
