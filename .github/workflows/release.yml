# Tag `vX.Y.Z` (made by `node scripts/release.mjs X.Y.Z`, see the commands it
# prints) and this workflow builds the CLI bundle, writes SHA256SUMS, smoke-tests
# the exact bundle on Linux, macOS, and Windows, publishes the three packages to
# npm with provenance via trusted publishing (OIDC, no NPM_TOKEN secret), and
# creates the GitHub release with the bundle and checksums attached.
#
# One-time setup on npmjs.com for each of @mousedev/harness-core,
# @mousedev/harness-opencode, and @mousedev/harness: Settings > Publishing
# access > add a trusted publisher for this repository and workflow file
# (release.yml). First publish of a brand-new package name still needs a
# human with an npm token; after that, OIDC only.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.9

jobs:
  build:
    name: build bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tag matches the package versions
        run: |
          for p in core opencode cli; do
            v="$(jq -r .version "packages/$p/package.json")"
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then
              echo "packages/$p is $v but the tag is $GITHUB_REF_NAME; run scripts/release.mjs" >&2
              exit 1
            fi
          done
      - run: pnpm check
      - run: pnpm bundle
      - name: Write SHA256SUMS
        working-directory: packages/cli/dist
        run: |
          sha256sum mouse.mjs > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mouse-bundle
          path: |
            packages/cli/dist/mouse.mjs
            packages/cli/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mouse-bundle
          path: bundle
      # Checksum with node so the same step runs on all three OSes (macOS has
      # shasum, not sha256sum; Windows only has either inside git-bash).
      - name: Verify checksum
        shell: bash
        working-directory: bundle
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const want = readFileSync("SHA256SUMS", "utf8").trim().split(/\s+/)[0];
            const got = createHash("sha256").update(readFileSync("mouse.mjs")).digest("hex");
            if (want !== got) { console.error(`checksum mismatch: ${want} != ${got}`); process.exit(1); }
            console.log(`sha256 ok ${got}`);
          '
      - name: mouse --version
        shell: bash
        run: node bundle/mouse.mjs --version

  publish:
    name: publish to npm
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10. pnpm
      # publish shells out to whichever `npm` is on PATH, so upgrading the
      # global npm is what makes OIDC work below.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build dist for core and opencode
        run: pnpm -r --filter './packages/*' run build
      - run: pnpm bundle
      # `pnpm publish` (not `npm publish` per directory) is required here: it
      # rewrites `workspace:*` dependency ranges to the real versions and
      # applies each package's `publishConfig` (main/types/exports pointing at
      # dist instead of src). npm would publish `workspace:*` verbatim, which
      # installs nowhere. pnpm 9 does not have its own `--provenance` flag; it
      # hands publishing to `npm publish`, and npm reads the flag from the
      # environment, so NPM_CONFIG_PROVENANCE=true is the reliable form.
      # A version already on npm (the first publish of a new package name is
      # manual, see docs/releasing.md) is skipped, so re-running the tag still
      # smoke-tests the bundle and creates the GitHub release.
      - name: pnpm publish with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          version="${GITHUB_REF_NAME#v}"
          for p in core opencode cli; do
            name="$(jq -r .name "packages/$p/package.json")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
            else
              pnpm --filter "$name" publish --access public --no-git-checks
            fi
          done

  github-release:
    name: github release
    needs: [build, smoke, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mouse-bundle
          path: bundle
      # Release notes are the tag's section of CHANGELOG.md when it has one,
      # otherwise GitHub's generated notes. `gh` ships on the runner, so no
      # third-party release action is needed.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md 2>/dev/null || true)"
          args=(--title "$GITHUB_REF_NAME" --verify-tag)
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > notes.md
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          case "$version" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}" bundle/mouse.mjs bundle/SHA256SUMS
